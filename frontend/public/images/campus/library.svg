<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#grad)" />
  
  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="500" fill="url(#grid)" />
  </g>

  <!-- Category Badge -->
  <g transform="translate(60, 60)">
    <rect width="180" height="32" rx="16" fill="#FACC15" />
    <text x="90" y="21" fill="#3B0764" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1.5">SCHOOL FACILITY</text>
  </g>

  <!-- Decorative Crest Emblem Circle -->
  <g transform="translate(680, 80)" opacity="0.2">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#FACC15" stroke-width="4" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FFFFFF" stroke-width="2" />
  </g>

  <!-- Title & Subtitle Container -->
  <g transform="translate(60, 320)" filter="url(#shadow)">
    <text x="0" y="0" fill="#FACC15" font-family="'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="2">NOAH'S ACADEMY INCORPORATED · TAGUIG CITY</text>
    <text x="0" y="42" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="32" font-weight="900">Institutional Learning Resource Library</text>
    <text x="0" y="76" fill="#E9D5FF" font-family="'Inter', sans-serif" font-size="16" font-weight="600">Digital Reference Catalog & Reading Halls</text>
  </g>
</svg>